name: Full DevOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Docker Login
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/rohan-devops-app:${{ github.sha }} .
        docker tag ${{ secrets.DOCKER_USERNAME }}/rohan-devops-app:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/rohan-devops-app:latest

    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/rohan-devops-app:${{ github.sha }}
        docker push ${{ secrets.DOCKER_USERNAME }}/rohan-devops-app:latest
