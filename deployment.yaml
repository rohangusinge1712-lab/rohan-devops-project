apiVersion: apps/v1
kind: Deployment
metadata:
  name: rohan-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rohan-app
  template:
    metadata:
      labels:
        app: rohan-app
    spec:
      containers:
      - name: rohan-container
        image: rohangusinge1712/rohan-devops-app:latest
        ports:
        - containerPort: 80
